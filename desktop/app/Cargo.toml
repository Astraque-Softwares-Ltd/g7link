[package]
name = "g7link-desktop"
description = "G7 Link for Windows: the desktop app"
version.workspace = true
edition.workspace = true
# Above the workspace minimum: material-colors needs Rust 1.97.
rust-version = "1.97"
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "g7link-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
data-encoding.workspace = true
dirs.workspace = true
hostname.workspace = true
material-colors.workspace = true
g7link-core.workspace = true
g7link-vcam.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
cxx-qt-build = { workspace = true, features = ["link_qt_object_files"] }
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
