# SPDX-License-Identifier: GPL-3.0-or-later
# Builds everything a release ships, at a given version: the Linux packages
# and the signed Android app, each checked before it's uploaded (installs,
# starts, signature). Called by the release workflow (a tag) and the nightly
# one (a build from main), so both ship builds made and checked the same way.
# Run by hand, it builds the Linux packages alone, to try before releasing.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to build: 1.2.3, or a nightly's 1.2.3-nightly.N"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "The version to build: 1.2.3, or a nightly's 1.2.3-nightly.N"
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"
  VERSION: ${{ inputs.version }}

jobs:
  linux:
    name: Linux packages (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        run: bash .github/scripts/set-version.sh "$VERSION"
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgl1-mesa-dev libx11-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev \
            libfreetype-dev libdbus-1-dev libxtst-dev libavcodec-dev libavutil-dev \
            qt6-l10n-tools file desktop-file-utils appstream rpm shellcheck
          pkg-config --exists libavcodec libavutil
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools qtwaylandcompositor
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
      - name: Install appimagetool and the AppImage runtime (pinned, checked)
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o /tmp/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<'SUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/runtime-x86_64
          SUMS
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          echo "APPIMAGE_RUNTIME=/tmp/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate desktop/packaging/linux/g7link.desktop
          appstreamcli validate --no-net desktop/packaging/linux/org.g7link.desktop.metainfo.xml
      - name: Check the install script
        run: shellcheck -s sh desktop/packaging/linux/install.sh
      - name: Cache FFmpeg source archives
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ffmpeg-sources
          key: ffmpeg-sources-${{ hashFiles('desktop/packaging/linux/build-ffmpeg-backends.sh') }}
      - name: Build and package (.deb, .rpm, AppImage, tarball)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          FFMPEG_SOURCE_CACHE: ${{ runner.temp }}/ffmpeg-sources
        run: |
          cargo build --release -p g7link-desktop
          bash ./desktop/packaging/linux/build-ffmpeg-backends.sh
          ./desktop/packaging/linux/build-deb.sh
          ./desktop/packaging/linux/build-rpm.sh
          ./desktop/packaging/linux/build-appimage.sh
          ./desktop/packaging/linux/build-tarball.sh
          cp desktop/packaging/linux/install.sh dist/install.sh
      - name: Check video adapters in each package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          dpkg-deb -c dist/*.deb > /tmp/g7link-deb-files
          rpm -qlp dist/*.rpm > /tmp/g7link-rpm-files
          tar -tzf dist/*.tar.gz > /tmp/g7link-tar-files
          (cd /tmp && "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract 'usr/bin/libg7link-video-ffmpeg*.so')
          for major in 7 8 9; do
            adapter="libg7link-video-ffmpeg${major}.so"
            grep -F "$adapter" /tmp/g7link-deb-files
            grep -F "$adapter" /tmp/g7link-rpm-files
            grep -F "$adapter" /tmp/g7link-tar-files
            test -f "/tmp/squashfs-root/usr/bin/$adapter"
          done
      - name: Check that each package starts
        # A package that doesn't start must not ship. The .deb goes into a
        # clean Ubuntu 24.04, the oldest system the build supports.
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /dist/*.deb >/dev/null
            g7link-desktop --version
            # --version loads no platform plugin or QML module: check the
            # bundled libraries, plugins and the QML modules the app imports
            # (file dialogs need Qt.labs.folderlistmodel) find what they link.
            cd /usr/lib/g7link
            missing=$(for f in g7link-desktop lib/*.so.* plugins/*/*.so \
                $(find qml/QtQml qml/QtQuick/Window qml/QtQuick/Shapes qml/QtQuick/Dialogs \
                  qml/QtQuick/Effects qml/QtQuick/Layouts qml/QtQuick/Controls \
                  qml/QtQuick/Templates qml/Qt/labs/folderlistmodel -name "*.so"); do
              case "$f" in */platformthemes/*|*/libqeglfs*) continue ;; esac
              LD_LIBRARY_PATH=/usr/lib/g7link/lib ldd "$f" | grep "not found" | sed "s|^|$f:|"
            done | sort -u)
            if [ -n "$missing" ]; then echo "$missing"; exit 1; fi'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:40 bash -euc '
            dnf install -y -q --nogpgcheck /dist/*.rpm >/dev/null
            g7link-desktop --version'
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --version
          mkdir -p /tmp/tarball && tar -xzf dist/*.tar.gz -C /tmp/tarball
          /tmp/tarball/*/g7link-desktop --version
      - name: Check that install.sh installs and removes each package
        # The one-line install, from these files instead of GitHub: the .deb on
        # Ubuntu, the .rpm on Fedora, and the tarball in a home folder.
        run: |
          (cd dist && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS.txt)
          for image in ubuntu:24.04 fedora:40; do
            docker run --rm -v "$PWD/dist:/dist:ro" -e G7LINK_ASSETS_DIR=/dist "$image" sh -euc '
              sh /dist/install.sh
              g7link-desktop --version
              sh /dist/install.sh --uninstall
              # The shell remembers where it last ran the app, and dash
              # reports that even once the file is gone.
              hash -r
              ! command -v g7link-desktop'
          done
          # The tarball goes in a home folder and can't add system libraries;
          # a desktop has them, a bare container doesn't. Installing the .deb
          # and removing just it leaves exactly the libraries the app needs.
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends /dist/*.deb >/dev/null
            apt-get remove -y -qq g7link >/dev/null
            useradd -m user
            su user -c "G7LINK_ASSETS_DIR=/dist sh /dist/install.sh && ~/.local/bin/g7link-desktop --version"'
          rm dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            dist/install.sh

  android:
    # Signing needs the keystore, which only a release has.
    if: github.event_name != 'workflow_dispatch'
    name: Android app (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        run: bash .github/scripts/set-version.sh "$VERSION"
      - name: Install the pinned Rust toolchain and the Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: "platforms;android-37.0 ndk;30.0.16248370 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::the ANDROID_KEYSTORE secret isn't set"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        working-directory: android
        env:
          G7LINK_KEYSTORE: ${{ runner.temp }}/release.jks
          G7LINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # Phones: 64-bit ARM, and 32-bit ARM for older ones.
        run: ./gradlew --no-daemon assembleRelease -Pg7link.abis=arm64-v8a,armeabi-v7a
      - name: Check the signature, and name the app
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p out
          cp "$apk" "out/G7Link-${VERSION}-android.apk"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
