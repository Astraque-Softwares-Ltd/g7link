version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Moves with cxx-qt only (see Cargo.toml).
      - dependency-name: cxx
      # Drops the connection when a receiver pauses (see Cargo.toml).
      - dependency-name: noq-proto
        versions: ["1.4.0"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
