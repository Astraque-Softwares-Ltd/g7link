[package]
name = "g7link-ptrun"
description = "PowerToys Run & Command Palette extension helper for G7 Link"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[[bin]]
name = "g7link-ptrun"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
