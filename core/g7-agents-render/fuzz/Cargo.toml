# Fuzz targets for g7-agents-render (cargo-fuzz layout). Outside the main
# workspace: they need a nightly toolchain and are not run in CI.
#
#   cargo +nightly fuzz run markdown   # or diff, timeline, snippet
#
# The seed corpora in corpus/ are the hostile cases of tests/fixtures/.

[package]
name = "g7-agents-render-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
g7-agents-render = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff"
path = "fuzz_targets/diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timeline"
path = "fuzz_targets/timeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snippet"
path = "fuzz_targets/snippet.rs"
test = false
doc = false
bench = false
