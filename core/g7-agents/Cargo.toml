[package]
name = "g7-agents"
description = "G7 Agents host: runs the user's own coding-agent CLIs and serves threads on a local socket"
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["host"]
host = [
    "dep:clap",
    "dep:zbus",
    "dep:rand",
    "dep:dirs",
    "dep:tracing-subscriber",
    "dep:ignore",
    "dep:image",
    "dep:data-encoding",
    "dep:rusqlite",
    "dep:ruzstd",
    "tokio/process",
    "tokio/net",
    "tokio/signal",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/fs",
    "tokio/io-std",
]
fake-cli = []

[[bin]]
name = "g7-agents"
path = "src/main.rs"
required-features = ["host"]

[[bin]]
name = "g7-agents-fake-cli"
path = "src/bin/fake_cli.rs"
required-features = ["fake-cli"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt"] }
# The client checks the socket directory belongs to its own effective uid;
# the session reader opens files without following links or blocking.
rustix = { version = "1.1", features = ["process", "fs"] }

clap = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
# `@` file search, image intake and the images sent to the agents.
ignore = { workspace = true, optional = true }
image = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
# The thread store (`host/db`): bundled SQLite with FTS5's trigram tokenizer.
rusqlite = { workspace = true, optional = true }
# Compressed Codex rollouts (`host/sessions/zst.rs`): a pure-Rust zstd decoder, MIT.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net"] }

[lints]
workspace = true
