[workspace]
resolver = "3"
members = [
    "core/g7-agents",
    "core/g7-agents-render",
    "core/g7link-adb",
    "core/g7link-protocol",
    "core/g7link-core",
    "core/g7link-cli",
    "core/g7link-ffi",
    "desktop/app",
    "desktop/vcam",
    "tools/xtask",
]
# Patched crates, used through [patch.crates-io] below; the render crate's
# fuzz targets, which need a nightly toolchain.
exclude = ["third_party", "core/g7-agents-render/fuzz"]

[workspace.package]
version = "0.1.20"
edition = "2024"
rust-version = "1.97"
authors = ["The G7 Link contributors"]
repository = "https://github.com/Astraque-Softwares-Ltd/g7link"

# Each release's name, from a bee's life (0.1 Pollen, …); the release
# workflow puts it in the release's title.
[workspace.metadata.release]
name = "Pollen"

[workspace.dependencies]
g7-agents = { path = "core/g7-agents", version = "0.1.20", default-features = false }
g7-agents-render = { path = "core/g7-agents-render", version = "0.1.20" }
g7link-adb = { path = "core/g7link-adb", version = "0.1.20" }
g7link-protocol = { path = "core/g7link-protocol", version = "0.1.20" }
g7link-core = { path = "core/g7link-core", version = "0.1.20" }
g7link-vcam = { path = "desktop/vcam", version = "0.1.20" }

anyhow = "1"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive"] }
# Held to the version cxx-qt 0.10 generates its C++ for: a newer cxx changes
# the bridge's symbol names and the app no longer links. Move it together
# with cxx-qt.
cxx = "=1.0.202"
cxx-qt = "0.10"
cxx-qt-build = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
data-encoding = "2.11"
dirs = "7"
hostname = "0.4"
hmac = "0.13"
iroh = "1.3"
# 1.4.0 closes a connection when a stream buffers more than 1024 chunks, and
# its compaction never merges chunks it has already compacted, so a receiver
# that stops reading for a moment (a paused transfer, slow storage) loses the
# link. Held on 1.3 until a release fixes it.
noq-proto = { version = "~1.3", default-features = false }
iroh-mdns-address-lookup = "0.6"
material-colors = { version = "0.5", default-features = false, features = ["std", "quantize"] }
n0-future = "0.3"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
# g7-agents-render: Markdown, code highlighting with the pure-Rust regex
# engine (no Oniguruma, no theme files), and word marks in diffs. The
# grammars are bat's set through two-face (Kotlin, TypeScript, TOML and more
# beside syntect's own), its pure-Rust build: no theme is loaded.
pulldown-cmark = { version = "0.13.6", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
similar = { version = "3.2.1", default-features = false, features = ["inline"] }
# g7-agents: the `@` file list (honours .gitignore, never follows links) and
# image intake with only the four codecs G7 accepts.
ignore = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
blake3 = "1"
bytes = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
uniffi = "0.32"
tokio-util = "0.7"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds: full debug info for our crates, line tables only for
# dependencies (backtraces still name their lines). Keeps target/debug from
# growing by gigabytes per rebuild.
[profile.dev.package."*"]
debug = "line-tables-only"

# The agents' syntax grammars compile hundreds of regexes on first use; unoptimised, the render
# crate's tests take minutes. Optimise just the regex engines and syntect in debug builds.
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Android: release optimizations, but symbols are kept so UniFFI can read its
# metadata from the library; the Android build strips them when packaging.
[profile.android]
inherits = "release"
strip = "debuginfo"

# iroh's mDNS with one fix, until upstream has it: third_party/iroh-mdns-address-lookup/G7LINK.md.
[patch.crates-io]
iroh-mdns-address-lookup = { path = "third_party/iroh-mdns-address-lookup" }
swarm-discovery = { path = "third_party/swarm-discovery" }
